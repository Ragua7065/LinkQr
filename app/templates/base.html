<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}url-shortner{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='/css/style.css')}}">
</head>
<body>
    <header>
        <h2>Url-shortner</h2>
    <div class="container">
        <nav id="nav1">
            <a id="a1" href="{{ url_for('dash.dash') }}">Home</a>
            <a id="a3" href="{{ url_for('auth.register') }}">Register</a>
            <a id="a2" href="{{ url_for('auth.logout')}}">Logout</a>
        </nav>
    </div>
    </header>
    <main class="container">
        {% with messages=get_flashed_messages(with_categories=True) %}
            {% for category,message in messages %}
                <div class="flash {{'category'}}">{{message}}</div>
            {% endfor %}
        {% endwith %}
        {% block content %} {% endblock %}
    </main>
</body>
</html>
