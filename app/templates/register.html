{% extends "base.html" %}
{% block content %}
<div class="login-box">
    <h2>Login</h2>
    <form method="POST">
        <div class="form-group">
            <label for="username">username</label>
            <input type="text" name="rusername" id="username" required>
        </div>
        <div class="form-group">
            <label for="password">password</label>
            <input type="password" name="rpassword" id="password" required>
        </div>
        <div class="form-group">
            <label for="password">confirm password</label>
            <input type="password" name="rconfirmpassword" id="confirmpassword" required>
        </div>
        <button type="submit" class="btn" >Register</button>
    </form>
</div>
{% endblock %}
